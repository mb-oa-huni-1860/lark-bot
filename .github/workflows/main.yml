name: Run Lark Bot

on:
  schedule:
    # 05:00, 07:00, 10:00 UTC (Tương ứng 9h, 11h, 14h giờ Georgia)
    - cron: '0 5,7,10 * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Run Python script
        run: python lark_bot.py
